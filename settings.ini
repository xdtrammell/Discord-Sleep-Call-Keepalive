# Discord Sleep-Call Keepalive settings
# Changes are read automatically on every scheduled run.

Enabled=true

# The tool sends F15 only after this much genuine keyboard/mouse inactivity.
# Accepted range: 30 through 240 minutes.
IdleThresholdMinutes=165

# Automatically skip the input event during a detected full-screen Direct3D app
# or Windows presentation mode.
SkipWhenFullScreen=true

# False keeps the log small by recording status checks, sent inputs, tests, and errors,
# but not every routine 15-minute skip.
LogSkippedRuns=false
