name: Windows build and native layout self-test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile included C# source
        shell: powershell
        run: |
          Add-Type -Path .\DiscordKeepAlive.cs -OutputAssembly .\DiscordKeepAlive.exe -OutputType WindowsApplication
          if (-not (Test-Path .\DiscordKeepAlive.exe)) { throw 'Compiler did not produce an executable.' }
      - name: Check native INPUT layout without injecting keyboard input
        shell: powershell
        run: |
          $process = Start-Process -FilePath .\DiscordKeepAlive.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)." }
          $result = Get-Content (Join-Path $env:LOCALAPPDATA 'DiscordSleepCallKeepalive\status.txt') -Raw
          Write-Host $result
          if ($result -notmatch 'PASS: native INPUT layout is 40 bytes \(expected 40\)') { throw 'Unexpected native layout.' }
      - name: Package source distribution
        shell: powershell
        run: |
          $files = @('DiscordKeepAlive.cs','Install.cmd','Install.ps1','README.md','Uninstall.cmd','Uninstall.ps1','settings.ini','LICENSE')
          Compress-Archive -Path ($files + @('assets')) -DestinationPath Sleep-Call-Keepalive-Windows-v1.1.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sleep-Call-Keepalive-Windows-v1.1.1
          path: Sleep-Call-Keepalive-Windows-v1.1.1.zip
          if-no-files-found: error
